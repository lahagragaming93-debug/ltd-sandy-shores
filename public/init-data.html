<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Init — LTD Sandy Shores</title>
  <link rel="stylesheet" href="css/western.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card" style="max-width:680px;">
      <h1>Initialisation données</h1>
      <div class="subtitle">Page temporaire — Patron uniquement</div>

      <div id="status" class="alert info">
        <span class="icon">⏳</span>
        <span>Vérification de la session…</span>
      </div>

      <div id="content" class="hidden">
        <h3 style="margin-top:8px;">8 stations essence à créer</h3>
        <table class="data" id="preview-table">
          <thead>
            <tr>
              <th>Nom</th>
              <th class="right">Capacité</th>
              <th class="right">Prix/L</th>
              <th class="right">Seuil 20%</th>
              <th class="center">Statut</th>
            </tr>
          </thead>
          <tbody id="preview-body"></tbody>
        </table>

        <div class="row mt-3">
          <button class="btn btn-primary" id="btn-init">Créer les 8 stations</button>
          <button class="btn btn-ghost" id="btn-cancel">Annuler</button>
          <span class="spacer"></span>
          <a href="dashboard.html" class="btn btn-sm btn-ghost">← Dashboard</a>
        </div>

        <div id="result" class="mt-3"></div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth }              from './js/firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getUserDoc, setStation, listStations } from './js/api.js';
    import { isDirection }       from './js/utils/permissions.js';
    import { money, num, escapeHtml } from './js/utils/formatters.js';
    import { toastSuccess, toastError } from './js/utils/toast.js';

    const STATIONS = [
      { id: 'senora-way-rex',       nom: "Senora Way - Rex's Diner",                    stockMax: 10000, prixLitre: 5.00 },
      { id: 'route-68-ltd',         nom: "Route 68 LTD",                                stockMax:  7500, prixLitre: 5.00 },
      { id: 'route-68',             nom: "Route 68",                                    stockMax: 10000, prixLitre: 5.00 },
      { id: 'panorama-drive-sandy', nom: "Panorama Drive - Aérodrome Sandy Shores",     stockMax:  5000, prixLitre: 5.00 },
      { id: 'palomino-favelas',     nom: "Palomino Freeway - Favélas",                  stockMax: 15000, prixLitre: 6.00 },
      { id: 'clinton-vinewood',     nom: "Clinton Avenue - Vinewood",                   stockMax: 15000, prixLitre: 5.50 },
      { id: 'cholla-springs',       nom: "Cholla Springs Avenue",                       stockMax:  5000, prixLitre: 4.50 },
      { id: 'algonquin-boulevard',  nom: "Algonquin Boulevard",                         stockMax:  5000, prixLitre: 4.50 }
    ];

    const status = document.getElementById('status');
    const content = document.getElementById('content');
    const previewBody = document.getElementById('preview-body');
    const result = document.getElementById('result');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        status.className = 'alert danger';
        status.innerHTML = '<span class="icon">⛔</span><span>Tu n\'es pas connecté. <a href="index.html">Se connecter</a></span>';
        return;
      }
      const profile = await getUserDoc(user.uid);
      if (!profile || !isDirection(profile.role)) {
        status.className = 'alert danger';
        status.innerHTML = '<span class="icon">⛔</span><span>Réservé au Patron / Co-Patron.</span>';
        return;
      }
      status.className = 'alert ok';
      status.innerHTML = `<span class="icon">✓</span><span>Connecté en tant que <strong>${escapeHtml(profile.prenom)} ${escapeHtml(profile.nom)}</strong> (${profile.role}).</span>`;

      // Vérifier si stations déjà existantes
      const existantes = await listStations().catch(() => []);
      const existIds = new Set(existantes.map(s => s.id));

      previewBody.innerHTML = STATIONS.map(s => {
        const seuil = Math.round(s.stockMax * 0.20);
        const exists = existIds.has(s.id);
        return `
          <tr data-id="${s.id}">
            <td>${escapeHtml(s.nom)}</td>
            <td class="right mono">${num(s.stockMax)} L</td>
            <td class="right mono">${money(s.prixLitre)}</td>
            <td class="right mono">${num(seuil)} L</td>
            <td class="center">
              ${exists ? '<span class="badge warn">DÉJÀ EXISTANTE</span>' : '<span class="badge neutral">À créer</span>'}
            </td>
          </tr>
        `;
      }).join('');

      content.classList.remove('hidden');
    });

    document.getElementById('btn-cancel').addEventListener('click', () => {
      window.location.href = 'dashboard.html';
    });

    document.getElementById('btn-init').addEventListener('click', async () => {
      const btn = document.getElementById('btn-init');
      btn.disabled = true;
      btn.textContent = 'Création en cours…';
      result.innerHTML = '';

      let ok = 0, fail = 0;
      for (const s of STATIONS) {
        const seuil = Math.round(s.stockMax * 0.20);
        const row = previewBody.querySelector(`[data-id="${s.id}"] td:last-child`);
        try {
          await setStation(s.id, {
            nom: s.nom,
            stockActuel: 0,
            stockMax: s.stockMax,
            seuilAlerte: seuil,
            prixLitre: s.prixLitre
          });
          if (row) row.innerHTML = '<span class="badge ok">✓ CRÉÉE</span>';
          ok++;
        } catch (err) {
          console.error(s.id, err);
          if (row) row.innerHTML = `<span class="badge danger">✗ ${escapeHtml(err.code || 'erreur')}</span>`;
          fail++;
        }
      }

      result.className = fail === 0 ? 'alert ok' : 'alert warn';
      result.innerHTML = fail === 0
        ? `<span class="icon">🎉</span><span>${ok}/8 stations créées avec succès. <a href="stations.html">Voir les stations →</a></span>`
        : `<span class="icon">⚠</span><span>${ok} créées, ${fail} en erreur. Vérifie la console DevTools (F12).</span>`;

      btn.style.display = 'none';
      if (fail === 0) toastSuccess('8 stations créées !');
    });
  </script>
</body>
</html>
