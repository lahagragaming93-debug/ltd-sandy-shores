<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LTD Sandy Shores — Connexion</title>
  <link rel="stylesheet" href="css/western.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <h1>LTD Sandy Shores</h1>
      <div class="subtitle">Plateforme de gestion</div>

      <div class="login-tabs">
        <button id="tab-connexion" class="active">Connexion</button>
        <button id="tab-inscription">Inscription Direction</button>
      </div>

      <!-- ===== Connexion ===== -->
      <form id="form-connexion">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email" />

        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" required autocomplete="current-password" />

        <button type="submit" class="btn btn-primary mt-2" style="width:100%;">Se connecter</button>

        <p class="muted mono mt-3" style="font-size: 0.78rem; text-align:center;">
          <a href="#" id="lien-reset">Mot de passe oublié ?</a>
        </p>
      </form>

      <!-- ===== Inscription Direction (Patron / Co-Patron uniquement) ===== -->
      <form id="form-inscription" class="hidden">
        <div class="alert info mb-2">
          <span class="icon">ℹ</span>
          <span>Réservé au <strong>Patron</strong> et <strong>Co-Patron</strong> lors
          de la première installation. Les autres comptes sont créés depuis l'admin.</span>
        </div>

        <label for="reg-role">Rôle</label>
        <select id="reg-role" required>
          <option value="">— Sélectionner —</option>
          <option value="patron">Patron</option>
          <option value="co-patron">Co-Patron</option>
        </select>

        <div class="field-row">
          <div>
            <label for="reg-prenom">Prénom RP</label>
            <input type="text" id="reg-prenom" required />
          </div>
          <div>
            <label for="reg-nom">NOM RP</label>
            <input type="text" id="reg-nom" required style="text-transform:uppercase;" />
          </div>
        </div>

        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required autocomplete="email" />

        <label for="reg-password">Mot de passe (8+ caractères)</label>
        <input type="password" id="reg-password" required minlength="8" autocomplete="new-password" />

        <button type="submit" class="btn btn-primary mt-2" style="width:100%;">Créer mon compte</button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { connecter, inscrireDirection, envoyerResetMotDePasse } from './js/auth.js';
    import { getUserDoc } from './js/api.js';
    import { defaultLandingPage } from './js/utils/permissions.js';
    import { toast, toastError, toastSuccess } from './js/utils/toast.js';

    // Onglets
    const tabC = document.getElementById('tab-connexion');
    const tabI = document.getElementById('tab-inscription');
    const formC = document.getElementById('form-connexion');
    const formI = document.getElementById('form-inscription');
    tabC.addEventListener('click', () => {
      tabC.classList.add('active'); tabI.classList.remove('active');
      formC.classList.remove('hidden'); formI.classList.add('hidden');
    });
    tabI.addEventListener('click', () => {
      tabI.classList.add('active'); tabC.classList.remove('active');
      formI.classList.remove('hidden'); formC.classList.add('hidden');
    });

    // Auto-redirect si déjà connecté
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const profile = await getUserDoc(user.uid);
      if (profile && profile.statut === 'actif') {
        window.location.href = defaultLandingPage(profile.role);
      }
    });

    // Connexion
    formC.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pwd   = document.getElementById('login-password').value;
      try {
        const user = await connecter(email, pwd);
        const profile = await getUserDoc(user.uid);
        if (!profile) {
          toastError("Profil introuvable. Contacte la direction.");
          return;
        }
        if (profile.statut === 'suspendu') {
          toastError("Compte suspendu.");
          return;
        }
        if (profile.motDePasseProvisoire) {
          // forcer changement
          const nouveau = prompt("Premier accès — choisis un nouveau mot de passe (8+ caractères) :");
          if (nouveau && nouveau.length >= 8) {
            const { changerMotDePasse } = await import('./js/auth.js');
            await changerMotDePasse(nouveau);
            toastSuccess("Mot de passe mis à jour.");
          }
        }
        window.location.href = defaultLandingPage(profile.role);
      } catch (err) {
        toastError("Email ou mot de passe incorrect.");
        console.error(err);
      }
    });

    // Inscription Direction
    formI.addEventListener('submit', async (e) => {
      e.preventDefault();
      const role    = document.getElementById('reg-role').value;
      const prenom  = document.getElementById('reg-prenom').value.trim();
      const nom     = document.getElementById('reg-nom').value.trim();
      const email   = document.getElementById('reg-email').value.trim();
      const pwd     = document.getElementById('reg-password').value;
      if (!role) return toastError("Choisis un rôle.");
      try {
        await inscrireDirection(email, pwd, prenom, nom, role);
        toastSuccess("Compte créé. Redirection…");
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } catch (err) {
        toastError(err.message || "Erreur lors de la création.");
        console.error(err);
      }
    });

    // Reset mdp
    document.getElementById('lien-reset').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      if (!email) return toastError("Saisis ton email d'abord.");
      try {
        await envoyerResetMotDePasse(email);
        toast("Email de réinitialisation envoyé.", 'success');
      } catch (err) { toastError("Impossible d'envoyer l'email."); }
    });
  </script>
</body>
</html>
